<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Montserrat, sans-serif">
  <rect width="400" height="200" fill="#f8f8f6" rx="8"/>
  <text x="200" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#999" letter-spacing="2">ТЕСТ АВТОНОМИИ</text>
  <g transform="translate(40,50)">
    <rect width="140" height="56" rx="6" fill="#fff" stroke="#e5e5e5"/>
    <text x="70" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#333">CEO исчезает</text>
    <text x="70" y="40" text-anchor="middle" font-size="10" fill="#666">на квартал</text>
  </g>
  <line x1="180" y1="78" x2="210" y2="60" stroke="#e5e5e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="78" x2="210" y2="96" stroke="#e5e5e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g transform="translate(210,32)">
    <rect width="150" height="44" rx="6" fill="#fff" stroke="#2a7a2a"/>
    <text x="75" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#2a7a2a">Бизнес работает</text>
    <text x="75" y="34" text-anchor="middle" font-size="10" fill="#666">= система</text>
  </g>
  <g transform="translate(210,88)">
    <rect width="150" height="44" rx="6" fill="#fff" stroke="#b00000"/>
    <text x="75" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#b00000">Бизнес ломается</text>
    <text x="75" y="34" text-anchor="middle" font-size="10" fill="#666">= зависимость</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e5e5e5"/></marker></defs>
</svg>
